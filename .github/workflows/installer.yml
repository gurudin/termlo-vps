name: First public install and SSH binding
on:
  push:
    branches: ['verify-installer/interactive-review-20261123']
permissions:
  contents: read
jobs:
  first-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 23
    env:
      REVIEW_CANDIDATE: 'yes'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare a private Debian SSH host without Python or Termlo
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          docker network create termlo-review-net
          docker run -d --name termlo-review --network termlo-review-net --cap-add SYS_ADMIN --security-opt apparmor=unconfined debian:12-slim sleep infinity
          docker exec termlo-review apt-get update -qq
          docker exec -e DEBIAN_FRONTEND=noninteractive termlo-review apt-get install -y --no-install-recommends ca-certificates curl openssh-server
          docker exec termlo-review sh -ec '! command -v python3; install -dm700 /root/.ssh; install -dm755 /run/sshd'
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/review-bootstrap"
          docker cp "$RUNNER_TEMP/review-bootstrap.pub" termlo-review:/root/.ssh/authorized_keys
          host=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' termlo-review)
          gateway=$(docker network inspect -f '{{(index .IPAM.Config 0).Gateway}}' termlo-review-net)
          printf 'ListenAddress %s\nListenAddress 127.0.0.1\nPermitRootLogin prohibit-password\nPasswordAuthentication no\nKbdInteractiveAuthentication no\nUsePAM no\nDisableForwarding yes\nAllowUsers root@%s\nSubsystem sftp internal-sftp\n' "$host" "$gateway" > "$RUNNER_TEMP/private-sshd.conf"
          docker cp "$RUNNER_TEMP/private-sshd.conf" termlo-review:/run/review-sshd.conf
          docker exec termlo-review sh -ec 'usermod -p "*" root; chown root:root /root/.ssh/authorized_keys; chmod 600 /root/.ssh/authorized_keys; /usr/sbin/sshd -E /run/review-sshd.log -f /run/review-sshd.conf'
          printf 'REVIEW_HOST=%s\nREVIEW_USER=root\nREVIEW_BOOTSTRAP=%s/review-bootstrap\n' "$host" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Prepare a private SSH listener for a fresh Mac console
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          iface=$(route -n get default | awk '/interface:/ { print $2; exit }')
          host=$(ipconfig getifaddr "$iface")
          python3 -c 'import ipaddress,sys; a=ipaddress.ip_address(sys.argv[1]); assert a.is_private and not a.is_loopback' "$host"
          if ! ssh-keyscan -T 3 -t ed25519 "$host" > "$RUNNER_TEMP/already-listening" 2>/dev/null; then
            ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/review-host"
            printf 'ListenAddress %s\nListenAddress 127.0.0.1\nHostKey %s/review-host\nPidFile %s/review-sshd.pid\nPasswordAuthentication no\nKbdInteractiveAuthentication no\nPermitRootLogin no\nUsePAM no\nDisableForwarding yes\nAllowUsers %s@%s %s@127.0.0.1\nSubsystem sftp internal-sftp\n' "$host" "$RUNNER_TEMP" "$RUNNER_TEMP" "$(id -un)" "$host" "$(id -un)" > "$RUNNER_TEMP/review-sshd.conf"
            sudo /usr/sbin/sshd -f "$RUNNER_TEMP/review-sshd.conf"
          fi
          ssh-keyscan -T 5 -t ed25519 "$host" > "$RUNNER_TEMP/listening" 2>/dev/null
          printf 'REVIEW_HOST=%s\nREVIEW_USER=%s\n' "$host" "$(id -un)" >> "$GITHUB_ENV"
      - name: Use the public command, accept the defaults and bind a new client
        shell: bash
        run: python3 -B tests/interactive_review.py
      - name: Diagnose the private Debian listener
        if: failure() && runner.os == 'Linux'
        run: docker exec termlo-review sh -c 'tail -18 /run/review-sshd.log'
