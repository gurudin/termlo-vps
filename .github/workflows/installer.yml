name: Clean Linux installation
on:
  push:
    branches: [main, 'verify-installer/**']
  pull_request:

permissions:
  contents: read

jobs:
  installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12-slim', 'alpine:3.22']
    steps:
      - uses: actions/checkout@v5
      - name: Install, bind over SSH and sync a file in both directions
        run: |
          docker run --rm --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            -e TERMLO_DISPOSABLE_INSTALL_TEST=1 --mount type=bind,src="$PWD",dst=/src,readonly \
            '${{ matrix.image }}' sh /src/tests/clean-install.sh

  rocky-cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Verify Chromium and SSH sync on the stock Rocky kernel
        run: bash tests/rocky-cloud.sh

  existing-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Accept the default address on a Mac console with no saved server
        if: runner.os == 'macOS'
        run: PYTHONPATH=tests python3 -B -m unittest -v test_vps.HostDetectionTests
      - name: Reuse working tools and render a page with the native browser
        env:
          TERMLO_INSTALL_NETWORK: global
        run: |
          umask 077
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/host-key"
          printf 'ListenAddress 127.0.0.1\nPort 2222\nHostKey %s/host-key\nPidFile %s/sshd.pid\n' "$RUNNER_TEMP" "$RUNNER_TEMP" > "$RUNNER_TEMP/sshd_config"
          if [ "$(uname)" = Linux ]; then sudo install -d -m 0755 /run/sshd; fi
          sudo /usr/sbin/sshd -f "$RUNNER_TEMP/sshd_config"
          if python3 -c 'import sys; from pathlib import Path; home=Path.home(); sys.exit(not any(p.is_dir() and p.stat().st_mode & 0o022 for p in (home, home / ".ssh")))'; then
            if sh install.sh --check --without-claude --host 127.0.0.1 --port 2222 2>"$RUNNER_TEMP/ssh-permissions.log"; then exit 1; fi
            grep -F '[未通过] SSH 授权目录权限' "$RUNNER_TEMP/ssh-permissions.log"
            grep -F 'chmod go-w ' "$RUNNER_TEMP/ssh-permissions.log"
            chmod go-w "$HOME"
            if [ -d "$HOME/.ssh" ]; then chmod go-w "$HOME/.ssh"; fi
          fi
          for attempt in 1 2; do
            sh install.sh --without-claude --host 127.0.0.1 --port 2222 > "$RUNNER_TEMP/code"
            grep -q '^termlo://connect/' "$RUNNER_TEMP/code"
          done
          "$HOME/.local/bin/termlo" browser check
      - name: Render with an empty Mac home and no login keychain
        if: runner.os == 'macOS'
        run: |
          cli="$HOME/.local/bin/termlo"
          probe_home=$(mktemp -d "$RUNNER_TEMP/termlo-keychain.XXXXXXXX")
          HOME="$probe_home" CFFIXED_USER_HOME="$probe_home" "$cli" browser check </dev/null
